l_russian:
 CRL_dead_economy:0 "Мёртвая экономика"
 CRL_dead_economy_desc:0 "Казна пуста, шахты стоят, а заводы работают вполсилы. Страна держится на дисциплине, а не на достатке."
 CRL_iron_discipline:0 "Армия железной дисциплины"
 CRL_iron_discipline_desc:0 "Жестокая земля не может прокормить большую армию, зато каждый её солдат вымуштрован до предела."
 CRL_elite_assault:0 "Элитные штурмовые части"
 CRL_elite_assault_desc:0 "Немногочисленные, но беспощадные штурмовые отряды Дворца власти."
 CRL_closed_country:0 "Закрытая страна"
 CRL_closed_country_desc:0 "Границы закрыты, иностранцам не доверяют, торговля идёт неохотно."
 CRL_smoldering_split:0 "Тлеющий раскол"
 CRL_smoldering_split_desc:0 "Север недоволен Дворцом власти. Рано или поздно это закончится войной."
 PCL_popular_uprising:0 "Народное восстание"
 PCL_popular_uprising_desc:0 "Север поднялся за свободу. Людей много, порядка пока мало."
 PCL_provisional_government:0 "Временное правительство"
 PCL_provisional_government_desc:0 "До принятия конституции власть держится на Временном совете."
 PCL_northern_volunteers:0 "Северные добровольцы"
 PCL_northern_volunteers_desc:0 "Ополченцы быстро учатся и стоят насмерть на родной земле."
 PCL_new_republic_spirit:0 "Новая республика"
 PCL_new_republic_spirit_desc:0 "Война окончена, и Мирная земля строит государство заново."
 BLI_disputed_status:0 "Спорный статус островов"
 BLI_disputed_status_desc:0 "Голубые острова живут сами по себе, но Жестокая земля по-прежнему считает их своими."
 BLI_island_defence:0 "Островная оборона"
 BLI_island_defence_desc:0 "Гавани, маяки и береговые гарнизоны: враг высаживается на острова с большим трудом."
 BLI_small_population:0 "Малое население"
 BLI_small_population_desc:0 "На островах мало людей, и каждый боец на счету."
 PCL_YURI_NAME:0 "Юри"
