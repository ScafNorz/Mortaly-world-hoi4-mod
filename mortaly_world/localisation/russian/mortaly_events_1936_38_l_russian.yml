l_russian:
 mortaly_crl.1.a:0 "Направить остатки казны в промышленность"
 mortaly_crl.1.b:0 "Отдать всё армии"
 mortaly_crl.1.t:0 "Казна пуста"
 mortaly_crl.1.d:0 "Министр финансов докладывает Дворцу власти, что денег хватит максимум на три месяца. Заводы стоят без заказов, а армия ждёт жалованья. Кого спасать первым?"
 mortaly_crl.2.a:0 "Подтвердить, что острова принадлежат нам"
 mortaly_crl.2.b:0 "Не поднимать вопрос, пока не кончатся дела поважнее"
 mortaly_crl.2.t:0 "Кому принадлежат Голубые острова?"
 mortaly_crl.2.d:0 "Совет Дворца власти снова вспомнил про Голубые острова. По старым картам они принадлежат Жестокой земле, а сами острова считают себя независимыми. Воевать из-за них сейчас никто не собирается, но молчать тоже нельзя."
 mortaly_bli.1.a:0 "Мы независимы, и это не обсуждается"
 mortaly_bli.1.b:0 "Делать вид, что письма не было"
 mortaly_bli.1.t:0 "Что думает Дворец власти о наших островах?"
 mortaly_bli.1.d:0 "Из Жестокой земли пришло напоминание, что острова считаются её территорией. Совет островов должен ответить хотя бы для себя."
 mortaly_crl.3.a:0 "Пойти на уступки"
 mortaly_crl.3.b:0 "Подавить забастовку силой"
 mortaly_crl.3.t:0 "Забастовка северных рабочих"
 mortaly_crl.3.d:0 "Северные рабочие требуют повысить жалованье и вернуть отнятые выходные. Забастовка уже остановила два завода. Что ответит Дворец власти?"
 mortaly_crl.4.a:0 "Убрать сочувствующих из армии"
 mortaly_crl.4.b:0 "Закрыть глаза и не раздувать конфликт"
 mortaly_crl.4.t:0 "Офицерский корпус разделён"
 mortaly_crl.4.d:0 "Часть офицеров сочувствует северу и открыто говорит об этом. Верные Дворцу власти требуют навести порядок, пока не поздно."
 mortaly_crl.5.a:0 "Взять обоих под наблюдение"
 mortaly_crl.5.b:0 "Не придавать значения"
 mortaly_crl.5.t:0 "Скаф и Юри"
 mortaly_crl.5.d:0 "Агенты сообщают, что северное движение сплотилось вокруг двух имён: Скафа, к которому прислушиваются в городах, и Юри, которому верят в казармах. Пока это только разговоры."
 mortaly_crl.6.a:0 "Усилить контроль над севером"
 mortaly_crl.6.b:0 "Выслушать северных старейшин"
 mortaly_crl.6.t:0 "Последний приказ Дворца власти"
 mortaly_crl.6.d:0 "Дворец власти решает навести порядок на севере раз и навсегда. Приказ сулит прочную оборону, но северяне уже недовольны."
 mortaly_bli.2.a:0 "Готовиться помочь северянам"
 mortaly_bli.2.b:0 "Остаться в стороне"
 mortaly_bli.2.t:0 "Вести с севера"
 mortaly_bli.2.d:0 "На острова приходят слухи, что на севере Жестокой земли готовят выступление. Совет островов должен решить, на чьей он стороне, если оно начнётся."
 CRL_treasury_industry:0 "Казна в промышленность"
 CRL_treasury_industry_desc:0 "Остатки казны вложены в заводы."
 CRL_treasury_army:0 "Казна в армию"
 CRL_treasury_army_desc:0 "Армия получила деньги, заводы остались без заказов."
 CRL_strike_concessions:0 "Уступки рабочим"
 CRL_strike_concessions_desc:0 "Рабочие довольны, но выпуск упал."
 CRL_last_order_defence:0 "Последний приказ"
 CRL_last_order_defence_desc:0 "Север укреплён и охраняется усиленно."
