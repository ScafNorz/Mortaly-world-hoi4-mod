l_russian:
 PCL_provisional_council:0 "Временный совет"
 PCL_provisional_council_desc:0 "Север отделился. Временный совет собирается в Североград, чтобы принимать решения, пока нет ни конституции, ни армии."
 PCL_scaf_declaration:0 "Декларация Скафа"
 PCL_scaf_declaration_desc:0 "Скаф и Юри объявляют, что власть принадлежит людям, а не Дворцу власти."
 PCL_yuri_command:0 "Объединённое командование"
 PCL_yuri_command_desc:0 "Скаф и Юри вдвоём возглавляют и страну, и армию Мирной земли."
 PCL_restore_civil_rights:0 "Вернуть гражданские права"
 PCL_restore_civil_rights_desc:0 "Свобода слова и собраний возвращается первым же указом."
 PCL_northern_administration:0 "Администрация Севера"
 PCL_northern_administration_desc:0 "Старые чиновники остаются на местах, но теперь отвечают перед советом."
 PCL_call_the_militia:0 "Призыв ополчения"
 PCL_call_the_militia_desc:0 "Тысячи добровольцев приходят в военкоматы с собственными ружьями."
 PCL_capture_the_depots:0 "Северные склады"
 PCL_capture_the_depots_desc:0 "Армейские склады на севере теперь принадлежат Мирной земле."
 PCL_people_army:0 "Народная армия"
 PCL_people_army_desc:0 "Ополченцев сводят в дивизии и учат воевать по-настоящему."
 PCL_field_command:0 "Полевое командование"
 PCL_field_command_desc:0 "Штабы Юри учатся быстро принимать решения."
 PCL_defend_the_north:0 "Удержать Север"
 PCL_defend_the_north_desc:0 "Рубежи севера укрепляют: отступать некуда."
 PCL_appeal_to_the_isles:0 "Обращение к Голубым островам"
 PCL_appeal_to_the_isles_desc:0 "Скаф и Юри отправляют послание Голубым островам: Мирной земле нужны друзья."
 PCL_supply_corridor:0 "Морской коридор снабжения"
 PCL_supply_corridor_desc:0 "Суда с островов привозят грузы в северные порты."
 PCL_joint_command:0 "Совместное командование"
 PCL_joint_command_desc:0 "Штабы Мирной земли и Голубых островов работают вместе."
 PCL_constitution:0 "Конституция Мирной земли"
 PCL_constitution_desc:0 "Страна принимает конституцию, и временное правительство уходит в историю."
 PCL_rebuild_the_country:0 "Восстановление страны"
 PCL_rebuild_the_country_desc:0 "Фабрики, дороги и мосты строят заново."
 PCL_civilian_control:0 "Гражданский контроль над армией"
 PCL_civilian_control_desc:0 "Генералы подчиняются избранным властям."
 PCL_amnesty:0 "Общее примирение"
 PCL_amnesty_desc:0 "Бывшим врагам предлагают вернуться домой."
 PCL_new_republic:0 "Новая республика"
 PCL_new_republic_desc:0 "Мирная земля больше не мятеж, а государство."
 BLI_island_council:0 "Совет островов"
 BLI_island_council_desc:0 "Старейшины и капитаны островов собираются, чтобы решить, как жить дальше."
 BLI_define_our_status:0 "Определить наш статус"
 BLI_define_our_status_desc:0 "Острова фактически независимы, но Жестокая земля не признаёт этого. Совет решает, что отвечать."
 BLI_expand_the_ports:0 "Расширить гавани"
 BLI_expand_the_ports_desc:0 "Причалы углубляют, склады достраивают."
 BLI_coastal_guard:0 "Береговая охрана"
 BLI_coastal_guard_desc:0 "Дозорные катера и береговые батареи охраняют проливы."
 BLI_island_militia:0 "Островное ополчение"
 BLI_island_militia_desc:0 "Жители островов учатся держать оружие."
 BLI_trade_routes:0 "Морские торговые пути"
 BLI_trade_routes_desc:0 "Острова торгуют со всем миром, кроме враждебных соседей."
 BLI_island_defence_network:0 "Единая система обороны островов"
 BLI_island_defence_network_desc:0 "Береговая охрана, гарнизоны и маяки связаны в одну сеть."
 BLI_open_the_ports:0 "Открыть порты Севера"
 BLI_open_the_ports_desc:0 "Гавани островов открыты для кораблей Мирной земли."
 BLI_volunteer_detachment:0 "Добровольческий отряд"
 BLI_volunteer_detachment_desc:0 "Островные добровольцы отплывают на север."
 BLI_join_the_peace_alliance:0 "Союз с Мирной землёй"
 BLI_join_the_peace_alliance_desc:0 "Острова и север заключают союз."
 BLI_international_recognition:0 "Международное признание"
 BLI_international_recognition_desc:0 "После войны острова добиваются признания."
 BLI_status_treaty:0 "Договор о статусе островов"
 BLI_status_treaty_desc:0 "Мирная земля признаёт независимость островов и подписывает договор о торговле и ненападении."
 BLI_army_foundation:0 "Основы армии"
 BLI_army_foundation_desc:0 "Островные гарнизоны сводят в единую армию с общим уставом и учебными лагерями."
 BLI_army_training:0 "Учебные лагеря"
 BLI_army_training_desc:0 "Новобранцев учат на каждом острове, чтобы резерв был всегда под рукой."
 BLI_army_equipment:0 "Вооружение армии"
 BLI_army_equipment_desc:0 "Склады островов пополняют винтовками, а ремонтные мастерские учатся делать больше."
 BLI_air_foundation:0 "Основы авиации"
 BLI_air_foundation_desc:0 "На главном острове строят первый аэродром и учат первых лётчиков."
 BLI_air_squadrons:0 "Островные эскадрильи"
 BLI_air_squadrons_desc:0 "Первые истребители прикрывают небо над островами и проливами."
 BLI_air_defence:0 "Воздушная оборона"
 BLI_air_defence_desc:0 "Посты наблюдения и зенитные точки связывают с аэродромом общей сетью оповещения."
 BLI_navy_foundation:0 "Основы флота"
 BLI_navy_foundation_desc:0 "Рыбацкие и торговые суда переоборудуют в боевые, а капитанов учат воевать."
 BLI_navy_harbours:0 "Верфи островов"
 BLI_navy_harbours_desc:0 "Достраивают верфи и пополняют запас транспортных судов."
 BLI_navy_fleet:0 "Флот островов"
 BLI_navy_fleet_desc:0 "Эсминцы и подводные лодки несут дозор между островами."
 PCL_civil_rights:0 "Гражданские права"
 PCL_civil_rights_desc:0 "Свобода слова и собраний укрепляет поддержку нового государства."
 PCL_northern_admin:0 "Администрация Севера"
 PCL_northern_admin_desc:0 "Местные чиновники подчиняются Временному совету."
 PCL_people_army_spirit:0 "Народная армия"
 PCL_people_army_spirit_desc:0 "Ополчение превращается в регулярные дивизии."
 PCL_field_command_spirit:0 "Полевое командование"
 PCL_field_command_spirit_desc:0 "Штабы быстро реагируют на изменения на фронте."
 PCL_northern_defence:0 "Удержать Север"
 PCL_northern_defence_desc:0 "Рубежи севера укреплены."
 PCL_supply_corridor_spirit:0 "Морской коридор снабжения"
 PCL_supply_corridor_spirit_desc:0 "Грузы с островов идут в северные порты."
 PCL_civilian_control_spirit:0 "Гражданский контроль над армией"
 PCL_civilian_control_spirit_desc:0 "Армия подчиняется выборным властям."
 PCL_amnesty_spirit:0 "Общее примирение"
 PCL_amnesty_spirit_desc:0 "Бывшие противники возвращаются к мирной жизни."
 BLI_coastal_guard_spirit:0 "Береговая охрана"
 BLI_coastal_guard_spirit_desc:0 "Катера и батареи прикрывают острова."
 BLI_island_militia_spirit:0 "Островное ополчение"
 BLI_island_militia_spirit_desc:0 "Жители островов готовы защищать их."
 BLI_trade_routes_spirit:0 "Морские торговые пути"
 BLI_trade_routes_spirit_desc:0 "Торговля приносит островам деньги и влияние."
 BLI_island_defence_2:0 "Единая оборона островов"
 BLI_island_defence_2_desc:0 "Все острова защищены общей системой обороны."
 BLI_open_harbours:0 "Гавани Голубых островов"
 BLI_open_harbours_desc:0 "Корабли островов подвозят припасы."
 BLI_army_foundation_spirit:0 "Основы армии"
 BLI_army_foundation_spirit_desc:0 "Общий устав и учебные лагеря на всех островах."
 BLI_air_squadrons_spirit:0 "Островные эскадрильи"
 BLI_air_squadrons_spirit_desc:0 "Истребители прикрывают острова и проливы."
 BLI_navy_foundation_spirit:0 "Основы флота"
 BLI_navy_foundation_spirit_desc:0 "Островные капитаны знают каждый пролив."
 BLI_navy_fleet_spirit:0 "Флот островов"
 BLI_navy_fleet_spirit_desc:0 "Дозорные корабли охраняют морские пути."
 BLI_recognition:0 "Международное признание"
 BLI_recognition_desc:0 "Мир признал острова независимыми."
