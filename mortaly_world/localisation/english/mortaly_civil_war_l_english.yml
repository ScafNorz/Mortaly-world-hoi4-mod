l_english:
 mortaly_war.1.a:0 "Начинается война"
 mortaly_war.1.t:0 "Раскол Жестокой земли"
 mortaly_war.1.d:0 "Терпение севера кончилось. Города и гарнизоны северных стейтов отказались подчиняться Дворцу власти и объявили о создании Мирной земли. Скаф и Юри провозгласили республику и возглавили северные войска. Начинается гражданская война."
 mortaly_war.2.a:0 "Остаться с Дворцом власти"
 mortaly_war.2.b:0 "Встать под знамёна Скафа и Юри"
 mortaly_war.2.t:0 "На чьей вы стороне?"
 mortaly_war.2.d:0 "Север восстал, и вы можете остаться верным Дворцу власти или перейти к Скафу. Если выберете Скафа, вы возьмёте управление Мирной землёй, а Жестокая земля продолжит воевать под управлением ИИ."
 mortaly_war.3.a:0 "Вступить в союз с Мирной землёй"
 mortaly_war.3.b:0 "Остаться нейтральными"
 mortaly_war.3.t:0 "Решение Голубых островов"
 mortaly_war.3.d:0 "Север Жестокой земли восстал против Дворца власти. Совет островов должен решить, поможет ли он Мирной земле или останется в стороне."
 mortaly_war.11.a:0 "Объявить амнистию"
 mortaly_war.11.b:0 "Начать репрессии"
 mortaly_war.11.t:0 "Победа Дворца власти"
 mortaly_war.11.d:0 "Мятеж подавлен. Северные стейты возвращены, а Мирная земля перестала существовать. Голубые острова, вставшие на сторону севера, тоже вошли в состав Жестокой земли. Теперь Дворец власти решает, как поступить с побеждёнными."
 mortaly_war.12.a:0 "Да здравствует Мирная земля!"
 mortaly_war.12.t:0 "Провозглашение Мирной земли"
 mortaly_war.12.d:0 "Дворец власти пал. Мирная земля объединила обе половины страны и стала единой демократической республикой. Голубые острова сохранили независимость: Мирная земля гарантирует её и остаётся с островами в союзе. Впереди восстановление и новая конституция."
 mortaly_war.13.a:0 "Подтвердить союз и гарантии"
 mortaly_war.13.b:0 "Ограничиться торговым соглашением"
 mortaly_war.13.t:0 "Договор с Голубыми островами"
 mortaly_war.13.d:0 "Война окончена. Мирная земля не тронула острова: она гарантирует их независимость и предлагает остаться в союзе."
 mortaly_war.30.a:0 "Продолжить за Мирную землю"
 mortaly_war.30.b:0 "Продолжить за Голубые острова"
 mortaly_war.30.c:0 "Принять поражение"
 mortaly_war.30.t:0 "Дворец власти пал"
 mortaly_war.30.d:0 "Жестокая земля капитулировала. Вы можете принять поражение или продолжить борьбу, взяв управление другой страной."
 mortaly_war.31.a:0 "Продолжить за Жестокую землю"
 mortaly_war.31.b:0 "Продолжить за Голубые острова"
 mortaly_war.31.c:0 "Принять поражение"
 mortaly_war.31.t:0 "Мирная земля побеждена"
 mortaly_war.31.d:0 "Мирная земля капитулировала. Вы можете принять поражение или продолжить борьбу, взяв управление другой страной."
 PCL_peace_union:0 "Peace Union"
